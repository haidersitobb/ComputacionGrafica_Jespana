<p-toast></p-toast>

<div class="formulario">
  <p-card header="Registro de Usuario">
    <p-panel header="Información Personal">
      <div class="p-field">
        <label for="name">Nombre:</label>
        <input id="name" pInputText [(ngModel)]="name" placeholder="Tu nombre" />
      </div>

      <div class="p-field">
        <label for="password">Contraseña:</label>
        <p-password [(ngModel)]="password"></p-password>
      </div>

      <div class="p-field">
        <label>Ciudad:</label>
        <p-select [options]="cities" [(ngModel)]="city" placeholder="Selecciona ciudad"></p-select>
      </div>

      <div class="p-field">
        <label>Fecha de nacimiento:</label>
        <p-datePicker [(ngModel)]="birthDate"></p-datePicker>
      </div>

      <div class="p-field">
        <label>Género:</label>
        <div>
          <p-radioButton name="gender" value="M" [(ngModel)]="gender" label="Masculino"></p-radioButton>
          <p-radioButton name="gender" value="F" [(ngModel)]="gender" label="Femenino"></p-radioButton>
        </div>
      </div>

      <div class="p-field">
        <label>Volumen:</label>
        <p-slider [(ngModel)]="volume"></p-slider>
      </div>

      <div class="p-field">
        <p-checkbox [(ngModel)]="acceptTerms" binary="true" label="Aceptar términos y condiciones"></p-checkbox>
      </div>
    </p-panel>

    <div class="p-mt-3">
      <button pButton type="button" label="Enviar" icon="pi pi-check" (click)="submitForm()"></button>
    </div>
  </p-card>
</div>
